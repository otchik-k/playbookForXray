---
- name: Server setup with Xray and the 3x-ui panel
  hosts: xray_servers
  become: yes
  
  roles:
    - server_prep
    
    # Раскомментируйте нужную роль в зависимости от ваших целей:
    
    # Вариант А: Только Xray-core без панели
    # - xray_install
    
    # Вариант Б: Только панель 3x-ui (она сама скачает нужный Xray)
    - 3xui_install
    
    # Вариант В: Оба вместе (может вызвать конфликт портов!)
    # - xray_install
    # - 3xui_install